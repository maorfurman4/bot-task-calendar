name: Deploy Yossi to Vercel

# מעתיק את הסודות מ-GitHub ל-Vercel, מעלה גרסה ומחבר את טלגרם ל-webhook.
# להריץ ידנית (Actions → Run workflow) — פעם אחת, ושוב רק אם סוד השתנה.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_PY1KdjbsQ6zgSh4YmHEwiIXx
      VERCEL_PROJECT_ID: prj_4LIfj5WDd8shJXaRApiP1FqUTOja
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_TASKS_CREDENTIALS: ${{ secrets.GOOGLE_TASKS_CREDENTIALS }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEWS_DISPATCH_TOKEN: ${{ secrets.NEWS_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Clean token
        # רווח או שורה חדשה שהודבקו עם הטוקן שוברים אותו
        run: |
          CLEAN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "token length: ${#VERCEL_TOKEN} → ${#CLEAN}"
          echo "VERCEL_TOKEN=$CLEAN" >> "$GITHUB_ENV"

      - name: Link project
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Copy secrets to Vercel
        # דרך ה-API ולא `vercel env add` — ה-CLI נכשל שם, וככה גם JSON עם מרכאות עובר בשלמותו
        shell: python
        run: |
          import json, os, urllib.request
          url = (f"https://api.vercel.com/v10/projects/{os.environ['VERCEL_PROJECT_ID']}/env"
                 f"?upsert=true&teamId={os.environ['VERCEL_ORG_ID']}")
          for name in ["TELEGRAM_TOKEN", "CHAT_ID", "OPEN_API_KEY", "GOOGLE_SERVICE_ACCOUNT_JSON", "GOOGLE_TASKS_CREDENTIALS",
                       "CRON_SECRET", "NEWS_DISPATCH_TOKEN"]:
              body = {"key": name, "value": os.environ[name], "type": "encrypted", "target": ["production"]}
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method="POST", headers={
                  "Authorization": f"Bearer {os.environ['VERCEL_TOKEN']}", "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as resp:
                  print(name, resp.status)

      - name: Deploy
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Point Telegram to Vercel
        run: |
          TOKEN=$(printf '%s' "$TELEGRAM_TOKEN" | tr -d '[:space:]')
          SECRET=$(printf '%s' "$TOKEN" | sha256sum | cut -c1-32)  # אותו חישוב כמו webhook_secret()
          info() {
            curl -s "https://api.telegram.org/bot$TOKEN/getWebhookInfo" \
              | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; print("webhook:", r.get("url") or "-", "| pending:", r["pending_update_count"], "| last error:", r.get("last_error_message", "-"), "| at:", r.get("last_error_date", "-"))'
          }
          echo "before:" && info
          curl -sf "https://api.telegram.org/bot$TOKEN/setWebhook" \
            -d url=https://yossi-bot.vercel.app/api/webhook \
            -d secret_token="$SECRET" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' | grep -q '"ok":true'
          echo "after:" && info
